<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Connecting…</title></head>
<body style="font-family:system-ui;background:#0d1b3d;color:#fff;text-align:center;padding:60px">
<p id="m">Connecting to TikTok…</p>
<script>
const WORKER = "https://mqdf-publisher.chitoufawazbolade.workers.dev";
const q = new URLSearchParams(location.search);
if (q.get("error")) document.getElementById("m").textContent = "Login cancelled: " + q.get("error_description");
else fetch(WORKER + "/token", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: q.get("code") }) })
  .then(r => r.json()).then(t => {
    if (t.access_token) { sessionStorage.setItem("tt_token", t.access_token); location.replace("./"); }
    else document.getElementById("m").textContent = "Login failed: " + (t.error_description || t.error || "unknown");
  });
</script></body></html>
